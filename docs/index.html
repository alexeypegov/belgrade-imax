<!DOCTYPE HTML>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="rgb(255,255,255)" media="(prefers-color-theme: light)" />
  <meta name="theme-color" content="rgb(24,24,24)" media="(prefers-color-theme: dark)" />
  <title>Beograd IMAX raspored</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="bg|imax" />
  <script type="text/javascript" src="elm.min.js"></script>
  <style type="text/css">
    html,
    body,
    main {
      padding: 0;
      margin: 0;
    }

    html,
    body {
      background-color: rgb(255, 255, 255);
    }

    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: rgb(24, 24, 24);
      }
    }
  </style>
</head>

<body>
  <main></main>
  <script type="text/javascript">
    const mq = window.matchMedia('(prefers-color-scheme: dark)');

    var app = Elm.Main.init({
      node: document.querySelector('main'),
      flags: {
        darkMode: mq.matches,
        width: window.innerWidth
      }
    });

    const handler = (e) => {
      app.ports.themeChanged.send(e.matches);
    };

    app.ports.logError.subscribe(msg => console.log(msg));

    if (mq.addEventListener) {
      mq.addEventListener("change", handler);
    } else if (mq.addListener) {
      mq.addListener(handler);
    }
  </script>
</body>

</html>
